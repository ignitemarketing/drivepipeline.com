# Static-site checks for drivepipeline.com.
#
# The job is named `validate` because the main-branch ruleset requires a
# status check with that name. Every check runs even after an earlier one
# fails (`if: ${{ !cancelled() }}`), and the last step names every failure.
# scripts/check-ci-run-through.mjs fails the build if a check step loses
# that condition or chains two commands.

name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: HTML validation
        id: html
        if: ${{ !cancelled() }}
        run: npx --yes html-validate@11.6.2 "**/*.html"

      # Local links only: https:// URLs are external, and /cdn-cgi/ paths are
      # generated by the Cloudflare edge, so neither exists in this checkout.
      - name: Internal links
        id: links
        if: ${{ !cancelled() }}
        run: npx --yes linkinator@8.0.3 . --recurse --skip '^https://' --skip '/cdn-cgi/'

      - name: No localhost references
        id: localhost
        if: ${{ !cancelled() }}
        run: |
          if grep -rEn 'http://localhost|127\.0\.0\.1' --include=*.html --include=*.css --include=*.js --exclude-dir=node_modules .; then
            echo "::error::localhost reference found"
            exit 1
          fi

      - name: Workflow run-through guard
        id: guard
        if: ${{ !cancelled() }}
        run: node scripts/check-ci-run-through.mjs

      - name: Summary
        if: ${{ !cancelled() }}
        env:
          HTML: ${{ steps.html.outcome }}
          LINKS: ${{ steps.links.outcome }}
          LOCALHOST: ${{ steps.localhost.outcome }}
          GUARD: ${{ steps.guard.outcome }}
        run: |
          failed=0
          report() {
            echo "$1: $2"
            if [ "$2" != "success" ]; then
              echo "::error::$1 failed ($2)"
              failed=1
            fi
          }
          report "HTML validation" "$HTML"
          report "Internal links" "$LINKS"
          report "No localhost references" "$LOCALHOST"
          report "Workflow run-through guard" "$GUARD"
          exit "$failed"
